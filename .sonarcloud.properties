# SonarQube Cloud Automatic Analysis configuration.
#
# Automatic Analysis reads THIS file. It does not read `sonar-project.properties`,
# which is the configuration for CI-driven scanners (see the `sonarqube` job in
# .github/workflows/ci.yml). The two files must be kept in agreement; each is
# only read by its own analysis method.
#
# Until this file existed, the `_bmad-output/**` exclusion committed in
# `sonar-project.properties` for issue #368 had no effect, and every pull
# request carrying BMad planning artifacts failed the new-code duplication gate
# on documents that say nothing about the codebase.

# Exclude BMad planning artifacts from analysis entirely. `_bmad-output/` holds
# agent-generated planning documents (PRDs, decision logs, design specs, review
# reports) and HTML decision prototypes that render the same component in
# several variants side by side so a reviewer can compare them. That repetition
# is the artifact's purpose, and it is committed as part of the story record,
# not as product code.
sonar.exclusions=_bmad-output/**

# Exclude test code from copy-paste detection. Test setup is legitimately
# repetitive: many test modules arrange the same small "world" (a portfolio
# with a cash account and a securities depot) and assert against it. Shared
# helpers under test/support already de-duplicate what can be de-duplicated;
# the residual repetition in test bodies should not count against the new-code
# duplication gate (issue #368).
sonar.cpd.exclusions=test/**,mcp-server/test/**
