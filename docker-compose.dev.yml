# The DEVELOPMENT configuration (#760): source mounted, Mix present, a public
# database password. Never the documented deployment — that is
# docker-compose.yml (a production release). Run with:
#   docker compose -f docker-compose.dev.yml up --build
# The database port is published for local tooling; the tokens have no
# fallback so a development stack never authenticates with a public string.
# Every port is published on loopback only (E25 S2): the database password
# is a public value, so nothing beyond this machine may reach either service.
# The session key is generated once into the app-build volume
# (_build/dev_secret_key_base), and debug pages are off unless
# PORTFOLIXIR_DEV_DEBUG_ERRORS switches them on (N-01).
#
# A Compose project of its own (#932): without a name, this file and
# docker-compose.yml both took the checkout directory's name, so in one
# checkout the two stacks replaced each other's containers and shared one
# database volume, and the development reset (`down -v`) deleted the
# production database. The database volume has a name of its own too, so the
# data stays apart even when COMPOSE_PROJECT_NAME or -p forces one project on
# both files. docker-compose.yml keeps its unnamed project and its volume
# name: a deployment's database lives under exactly that name.
name: portfolixir-dev

services:
  db:
    # Pinned by tag and digest (ADR-0045 §2, E25 S2); Dependabot's
    # docker-compose ecosystem moves both, never across a PostgreSQL major.
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: portfolixir_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - portfolixir-dev-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolixir_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    # Rotated, so a client that makes the application log a lot cannot fill
    # the disk the database lives on (security review 2026-10-12, H70).
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: dev
      DATABASE_HOST: db
      DATABASE_NAME: portfolixir_dev
      PHX_BIND_ALL: true
      # "app" is the name the MCP companion reaches the app under.
      PORTFOLIXIR_ALLOWED_HOSTS: app
      PORTFOLIXIR_API_TOKEN: ${PORTFOLIXIR_API_TOKEN:?set PORTFOLIXIR_API_TOKEN in .env}
      # Named as the production file names it (N-35): with a principal set,
      # the development server builds its principals by the release's rules,
      # so it refuses a placeholder or a token under 32 bytes at boot, as
      # CONTRIBUTING.md says, and the journal names "mcp" for the
      # companion's writes.
      PORTFOLIXIR_API_PRINCIPAL: mcp
      # Debug pages for a developer at work: off unless .env or the shell
      # says on and the application was compiled with that value
      # (config/dev.exs, docs/development/guide.md).
      PORTFOLIXIR_DEV_DEBUG_ERRORS: ${PORTFOLIXIR_DEV_DEBUG_ERRORS:-off}
      PORT: 4000
    # Descriptors above the listener's connection cap (500, config/config.exs),
    # so a flood of connections meets the cap, not the descriptor table.
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    ports:
      - "127.0.0.1:4000:4000"
    command: ["mix", "phx.server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - .:/app
      - app-deps:/app/deps
      - app-build:/app/_build
    # Rotated, so a client that makes the application log a lot cannot fill
    # the disk the database lives on (security review 2026-10-12, H70).
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      PORTFOLIXIR_API_BASE_URL: http://app:4000
      PORTFOLIXIR_API_TOKEN: ${PORTFOLIXIR_API_TOKEN:?set PORTFOLIXIR_API_TOKEN in .env}
      PORTFOLIXIR_MCP_TOKEN: ${PORTFOLIXIR_MCP_TOKEN:?set PORTFOLIXIR_MCP_TOKEN in .env}
      PORTFOLIXIR_MCP_TRANSPORT: http
      PORTFOLIXIR_MCP_HOST: 0.0.0.0
      PORTFOLIXIR_MCP_PORT: 4001
      # The same switches the production file passes (#1027), so the
      # development companion can run as read, book, full or label.
      PORTFOLIXIR_MCP_READ_ONLY: ${PORTFOLIXIR_MCP_READ_ONLY:-false}
      PORTFOLIXIR_MCP_PROFILE: ${PORTFOLIXIR_MCP_PROFILE:-}
    ports:
      - "127.0.0.1:4001:4001"
    # Rotated, so a client that makes the application log a lot cannot fill
    # the disk the database lives on (security review 2026-10-12, H70).
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  portfolixir-dev-postgres-data:
  app-deps:
  app-build:
