default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md,markdown
      - id: end-of-file-fixer
      - id: check-yaml
      - id: mixed-line-ending
        args:
          - --fix=lf

  - repo: local
    hooks:
      - id: check-invisible-unicode
        name: Reject invisible/bidi Unicode (Trojan Source defense)
        entry: python3 scripts/check_invisible_unicode.py
        language: system
        pass_filenames: false
        always_run: true
      - id: mix-format-check
        name: Elixir formatting check
        entry: mix format --check-formatted
        language: system
        pass_filenames: false
        files: "(\\.exs?$|^mix\\.exs$|^\\.formatter\\.exs$)"
      - id: llm-commit-footer
        name: Require commit footer with model and thinking level
        entry: bash scripts/validate-llm-commit-footer.sh
        language: system
        stages: [commit-msg]
        pass_filenames: true
