default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Every remote hook repository is frozen to the commit its tag named when
  # it was pinned (E25 S8, F60): a tag can be moved, a commit cannot.
  # `pre-commit autoupdate --freeze` moves the SHA and the comment together.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md,markdown
      - id: end-of-file-fixer
      - id: check-yaml
      - id: mixed-line-ending
        args:
          - --fix=lf

  - repo: local
    hooks:
      - id: check-invisible-unicode
        name: Reject invisible/bidi Unicode (Trojan Source defense)
        entry: python3 scripts/check_invisible_unicode.py
        language: system
        pass_filenames: false
        always_run: true
      - id: mix-format-check
        name: Elixir formatting check
        entry: mix format --check-formatted
        language: system
        pass_filenames: false
        files: "(\\.exs?$|^mix\\.exs$|^\\.formatter\\.exs$)"
      - id: commit-authorship
        name: Require commits authored by an accountable human
        entry: bash scripts/check-commit-authorship.sh
        language: system
        stages: [commit-msg]
        pass_filenames: true
