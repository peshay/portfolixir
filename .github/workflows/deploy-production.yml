name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full immutable image ref accepted from staging: ghcr.io/peshay/portfolixir@sha256:<digest>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portfolixir-deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: [self-hosted, Linux, X64, portfolixir, portfolixir-prod, deploy-prod]
    environment: production

    steps:
      - name: Validate immutable image ref
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/peshay/portfolixir@sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "image_ref must be ghcr.io/peshay/portfolixir@sha256:<64 hex>" >&2
            exit 64
          fi

      - name: Deploy production digest
        run: sudo /usr/local/sbin/portfolixir-deploy '${{ inputs.image_ref }}'

      - name: Record production target
        run: |
          echo "Environment: production"
          echo "Target: https://portfolixir.home.arpa"
          echo "Image: ${{ inputs.image_ref }}"
