name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Staging-accepted image digest, for example sha256:..."
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-handoff:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate digest input
        run: |
          case "${{ inputs.image_digest }}" in
            sha256:*) ;;
            *) echo "image_digest must start with sha256:" && exit 1 ;;
          esac

      - name: Record production deployment handoff
        run: |
          echo "Target: portfolixir.home.arpa"
          echo "Image: ghcr.io/peshay/portfolixir@${{ inputs.image_digest }}"
          echo "Production Environment protection must approve this handoff before use."
