# Sprint-cadence release automation (issue 659, ADR-0026 step 5): the
# bookkeeping close-out pushes an annotated vX.Y.Z tag on the sprint's merge
# commit, and this workflow turns the tag into a GitHub Release with
# generated notes — the squash-merged PR titles are the source material.
# Minor bump per sprint, patch reserved for hotfixes; first tag v0.5.0 at
# the Sprint 5 merge. No installable artifacts are built: the release is a
# rollback point for self-hosted instances plus a communicable changelog.
name: Release

# Both tag forms trigger: the owner's first release landed as bare `0.5.0`,
# so the bare-number scheme is the convention and `v*` stays for
# compatibility.
on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]

# contents: write is required to create the release; this workflow touches
# nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Lightweight-tag guard (Sprint 8 Lane Z): 0.5.0, 0.6.0 and 0.7.0 all
      # landed lightweight against ADR-0026 step 5's "annotated", because the
      # GitHub release UI cannot create annotated tags and the agent session's
      # git proxy cannot push tags at all. The release still happens (a
      # lightweight tag marks the right commit), but the miss is made loud: a
      # workflow warning plus a note prepended to the release body, both
      # pointing at the prepared-command path the close-out ledger carries.
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [ "$object_type" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          else
            echo "::warning title=Lightweight tag::$GITHUB_REF_NAME is a lightweight tag; ADR-0026 step 5 asks for an annotated one. Recreate it with the prepared command from the sprint retrospective's close-out ledger (git tag -a ... && git push origin <tag>)."
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes "> **Note:** this release was created from a *lightweight* tag. ADR-0026 step 5 asks for an annotated tag; the sprint retrospective's close-out ledger carries the prepared \`git tag -a\` command for the maintainer."
          fi
