name: Commit authorship

# Enforces that every commit is authored by an accountable human (see
# .github/commit-authorship-allowlist.txt). Local hooks can be bypassed with
# --no-verify; this workflow re-checks on the server, so make it a required
# status check on main to make the rule unavoidable.

on:
  pull_request:
  push:
    branches: ["main"]

# Least privilege: the check only reads the repository's commit metadata.
permissions:
  contents: read

jobs:
  human-accountability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned to a commit SHA, version in the comment (#772).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the commit range against the base resolves.
          fetch-depth: 0
          # Nothing here pushes: the job token does not stay in .git/config
          # for the check script (F61).
          persist-credentials: false

      # The event's SHAs reach the script through env, as data: a context
      # expression inside `run:` is pasted into the script as shell text
      # before bash reads it (F61). GITHUB_EVENT_NAME and GITHUB_SHA are the
      # runner's own variables.
      - name: Verify every commit is authored by an accountable human
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          else
            before="$PUSH_BEFORE_SHA"
            if printf '%s' "$before" | grep -qE '^0+$'; then
              # Branch creation / no parent recorded: check the tip commit only.
              range="HEAD~1..HEAD"
            else
              range="$before..$GITHUB_SHA"
            fi
          fi
          echo "Checking commit range: $range"
          bash scripts/check-commit-authorship.sh --range "$range"
