name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege for the whole workflow: every job here only reads the
# repository. Checkout, the language toolchains and the quality gates need
# nothing more, and the Codecov upload authenticates with its own token
# rather than the workflow's GITHUB_TOKEN. Without this key GitHub grants the
# default token set, which is wider than any job here uses.
permissions:
  contents: read

# Every action below is pinned to a commit SHA with its version tag in the
# comment (#772, the 2026-09-05 triage's L11): a tag can be moved, a commit
# cannot, and Dependabot's github-actions ecosystem bumps the SHA and the
# comment together.
#
# No job here pushes, so every checkout sets persist-credentials: false and
# the job token does not stay in .git/config for the steps after it -- a
# dependency's install code, a hook, a test (F61). For the same reason no
# `run:` script contains a context expression: refs and SHAs reach a script
# through `env:`, as data rather than as shell text.

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '27.3.4.18'

      - name: Install dependencies
        run: mix deps.get

      # pre-commit and every dependency it pulls, pinned by version and sha256
      # (E25 S8, F60): --require-hashes refuses anything the file does not
      # name with a matching hash, and --only-binary installs wheels only, so
      # no package's build script runs either. The hook repositories are
      # frozen to commits in .pre-commit-config.yaml.
      - name: Install pre-commit
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r .github/pre-commit/requirements.txt

      - name: Run pre-commit quality gates
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        # An exact tag and its digest (E25 S8, F60): the digest is what gets
        # pulled, the tag says which release that is. Dependabot does not read
        # service images, so the maintenance lane's PostgreSQL review moves
        # the pin, in both jobs at once -- ci_test holds them equal.
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '27.3.4.18'

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Prepare database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate

      # The full run log is captured to a file and uploaded on every outcome
      # (issue 654): the GitHub log API caps at the last 5000 lines, so on a
      # warning-heavy run the failure blocks scroll out of the retrievable
      # window and a red run leaves no usable evidence. pipefail keeps the
      # step's exit code that of mix, not tee.
      - name: Run test suite with coverage
        run: |
          set -o pipefail
          MIX_ENV=test mix coveralls.json 2>&1 | tee test-output.log

      - name: Upload test output artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output
          path: test-output.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          fail_ci_if_error: true

  quality:
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '27.3.4.18'

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      # The translation catalogs are what the source extracts (#924): until
      # Sprint 17 they were kept up by hand-appended entries, drifted from the
      # code, and only five named LiveViews were scanned for missing msgids.
      # The check recompiles the app to collect the msgids (gettext's extract
      # forces it) and fails when an extraction would change
      # priv/gettext/default.pot; the fix is
      # `mix gettext.extract --merge --no-fuzzy` and a translation, never a
      # hand edit.
      - name: Gettext catalogs match the source
        run: mix gettext.extract --check-up-to-date

      # `mix hex.audit` on the current Hex: retirements plus the hex.pm EEF
      # advisory feed, which Hex 2.5 gates on with no ignore mechanism. Until
      # Sprint 11 this step pinned Hex 2.4.1 (the last retirement-only
      # hex.audit) because cowlib carried three advisories with no fixed
      # release; Bandit replaced Cowboy (#772), cowlib left the tree, and the
      # pin and its exception went with it. An advisory that appears here
      # again is cleared by an upgrade, not by a pin.
      - name: Audit Hex packages (retirements and advisories)
        run: mix hex.audit

      # Fails the build on known security advisories in the Hex dependency
      # tree (mix_audit), with no ignore list: the cowlib advisory the list
      # used to carry (GHSA-g2wm-735q-3f56, no fixed release) left the tree
      # with the Bandit swap (#772, Sprint 11). This mirrors the HIGH-gated
      # posture of the npm audit (`--audit-level=high`); advisories are
      # cleared by upgrades, not by ignores.
      - name: Audit Hex dependencies
        run: mix deps.audit

      # AGENTS.md has always required `npm test` and `npm run build` for the
      # MCP companion, but CI only audited its dependencies — so an MCP-only
      # change (or a transitive major bump underneath the SDK) rested on an
      # unverifiable local claim. Under ADR-0036 "every quality gate green"
      # replaces the per-PR human read, so the companion's own gates have to
      # run here too. `npm ci` installs from the lockfile the audit above
      # already checked. `--ignore-scripts` blocks dependency lifecycle
      # scripts, which are arbitrary code execution on the runner at install
      # time; nothing in this tree needs them (the deps are the MCP SDK,
      # express, zod, tsx and typescript), and both gates below pass without.
      # Issue #728: the MCP gates ran on whatever Node ubuntu-latest shipped
      # that week — the one unpinned toolchain in this workflow. Pinned to
      # the 24 LTS line, the same major the companion's Dockerfile ships and
      # `engines.node` in mcp-server/package.json records, so CI, the image
      # and a local run agree — and `@types/node` has a runtime major to
      # follow instead of the registry's latest.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # D-7 (Sprint 15): the audit runs on the pinned Node 24 and its npm, not
      # on whatever npm the runner image ships. CI 1558 ran it before Setup
      # Node: that npm fell back to the quick-audit endpoint the registry is
      # retiring, which answered 400 and turned the gate red with no advisory
      # behind it. The level is unchanged — the fix is reading the right
      # endpoint, never making the gate optional.
      - name: Audit MCP server dependencies (npm)
        run: npm audit --audit-level=high --prefix mcp-server

      - name: Install MCP server dependencies
        run: npm ci --ignore-scripts --prefix mcp-server

      - name: MCP server tests
        run: npm test --prefix mcp-server

      - name: MCP server build
        run: npm run build --prefix mcp-server

      # Credo, Sobelow and Dialyzer are blocking quality gates. Sobelow skips
      # are per-function or per-pipeline `# sobelow_skip` annotations with a
      # written reason, and since Sprint 11 (#382) there is no --ignore. The
      # two findings sobelow 0.16 raises where nothing can carry an annotation
      # -- the HTTPS posture in config/prod.exs (TLS at the operator's reverse
      # proxy, PHX_FORCE_SSL as the runtime opt-in, D-2 of the Sprint 11 plan)
      # and the LiveView socket's origin check, set at runtime -- are skipped
      # by fingerprint in .sobelow-skips, each with its reason (#1006).
      - name: Credo
        run: mix credo --strict

      - name: Sobelow (security)
        run: mix sobelow --skip --exit

      - name: Restore PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27.3.4.18-elixir1.18.5-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp27.3.4.18-elixir1.18.5-

      - name: Build PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer --format short

  migration-immutability:
    runs-on: ubuntu-latest
    # Only meaningful on pull requests: it compares the branch against the
    # base. On a push to main there is no incoming change set to police, and
    # the diff would be empty or misleading, so the job is skipped there.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the pull request's base commit is already here
          # and the gate needs no fetch (and so no token) of its own.
          fetch-depth: 0
          persist-credentials: false

      # Applied migrations are immutable (see the migration-roundtrip job): an
      # already-merged migration must never change in any way, only new ones
      # be added. --no-renames reports a moved or renamed file as a deletion
      # plus an addition, and --diff-filter=a lists every status except
      # Added -- a modification, a deletion, a mode or type change -- so the
      # only change the gate lets through under priv/repo/migrations/ is a new
      # file. (F55: the former allow-list, --diff-filter=MD with rename
      # detection on, passed a renamed-and-edited migration as a rename.)
      # ci_test runs this script against a scratch repository.
      # The base is the pull request's base commit, an immutable SHA handed to
      # the script through env: a context expression inside `run:` is pasted
      # into the script as shell text before bash reads it (F61).
      - name: Reject any change to an existing migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "${BASE_SHA:?no pull request base commit}^{commit}"
          changed="$(git diff --no-renames --diff-filter=a --name-status "$BASE_SHA"...HEAD -- priv/repo/migrations/)"
          if [ -n "$changed" ]; then
            echo "Applied migrations are immutable; only new files may be added. These existing files changed:"
            echo "$changed"
            exit 1
          fi
          echo "No existing migration was changed."

  migration-roundtrip:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        # The test job's pin, tag and digest alike (E25 S8, F60).
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '27.3.4.18'

      - name: Install dependencies
        run: mix deps.get

      - name: Create database
        run: MIX_ENV=test mix ecto.create

      # A full `mix ecto.rollback --all` is not used: an early historical
      # migration (ExtendTransactionsForPpImport) is deliberately irreversible
      # (it drops a constraint with no inverse), and applied migrations are
      # treated as immutable, so they cannot be retrofitted with down/0. This
      # job instead verifies that the most recent migration is reversible
      # (migrate -> rollback one step -> migrate), which is the regression that
      # actually matters for new PRs.
      - name: Migrate, roll back latest, migrate again
        run: |
          MIX_ENV=test mix ecto.migrate
          MIX_ENV=test mix ecto.rollback
          MIX_ENV=test mix ecto.migrate

      # The round trip above migrates a database that holds no rows, and an
      # upgrade runs over every row an instance holds (Sprint 16's two
      # boot-stopping catches, the import-hash kind CHECK and CR-1's author
      # backfill, were invisible to it). The seeded-upgrade cases replay the
      # upgrade over synthetic legacy rows, each in a scratch database of its
      # own, and the rule beside them requires a case for every new migration
      # that adds a CHECK, a NOT NULL or a backfill (Portfolixir.SeededUpgrade,
      # Sprint 17 Lane G-1). The default suite runs them too; here they run on
      # their own, so a broken upgrade path reads as this job's failure.
      - name: Seeded upgrades over legacy rows
        run: MIX_ENV=test mix test --only seeded_upgrade

  # The Compose build route, proven here (Sprint 20 plan, D-3 as noted on
  # 2026-10-08): the job builds both images from this checkout exactly as an
  # operator does, `docker compose up --build -d`, starts the stack on secrets
  # it generates, and reads the page, an API read and a companion tool call
  # that goes through the app. It pushes, tags and publishes nothing: a
  # release is never an installable artifact (release.yml). It runs on the
  # runner's platform (amd64) and on an empty database, so it proves a fresh
  # install, not the upgrade of an existing volume.
  #
  # No `needs:`: it is the longest job and gates nothing, so it starts at once.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # A newer push to a pull request replaces its running build; on main every
    # head finishes, so each one's result stands.
    concurrency:
      group: compose-smoke-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the filter below finds the commit it compares
          # with and needs no fetch (and so no token) of its own.
          fetch-depth: 0
          persist-credentials: false

      # The stack is built only when a change can change what it builds: the
      # paths release.yml cuts a release for, the two build contexts'
      # .dockerignore files, and this workflow. A `paths:` filter on the
      # workflow would hold back every other job, and a third-party filter
      # action would be one more dependency on the runner, so git compares
      # the commits here. A pull request is compared with its base, a push
      # with the commit main moved from; where there is no such commit here
      # (a new branch, a force push), the stack is built. ci_test runs this
      # script against a scratch repository and holds the list equal to
      # release.yml's.
      - name: Decide whether the change touches the build
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$BASE_SHA"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git merge-base "$base" HEAD > /dev/null 2>&1; then
            echo "No commit to compare with: the stack is built."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD -- \
            ':(glob)lib/**' \
            ':(glob)priv/**' \
            ':(glob)config/**' \
            ':(glob)mix.exs' \
            ':(glob)mix.lock' \
            ':(glob)Dockerfile.release' \
            ':(glob)docker/**' \
            ':(glob)docker-compose.yml' \
            ':(glob)mcp-server/src/**' \
            ':(glob)mcp-server/package.json' \
            ':(glob)mcp-server/package-lock.json' \
            ':(glob)mcp-server/tsconfig.json' \
            ':(glob)mcp-server/.npmrc' \
            ':(glob)mcp-server/Dockerfile' \
            ':(glob).dockerignore' \
            ':(glob)mcp-server/.dockerignore' \
            ':(glob).github/workflows/ci.yml')"
          if [ -n "$changed" ]; then
            echo "The change touches what the stack builds:"
            echo "$changed"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the stack builds changed: no build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # One fresh secret for every `${VAR:?...}` docker-compose.yml requires,
      # generated as docs/home-deployment.md says (POSTGRES_PASSWORD in hex,
      # because it is spliced into a URL). The values are masked before any
      # step could print them and never leave this runner; .dockerignore keeps
      # .env out of the build context. The background fetches stay off: the
      # instance under test calls no provider, so the job proves the build and
      # the boot, not a provider's uptime.
      - name: Write a .env of generated secrets
        if: steps.changes.outputs.build == 'true'
        run: |
          umask 077
          : > .env
          for name in POSTGRES_PASSWORD SECRET_KEY_BASE PORTFOLIXIR_API_TOKEN PORTFOLIXIR_MCP_TOKEN; do
            if [ "$name" = POSTGRES_PASSWORD ]; then
              value="$(openssl rand -hex 32)"
            else
              value="$(openssl rand -base64 48 | tr -d '\n')"
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> .env
          done
          echo "PORTFOLIXIR_BACKGROUND_FETCH=off" >> .env

      - name: Build and start the Compose stack
        if: steps.changes.outputs.build == 'true'
        run: docker compose up --build -d

      # Compose starts the companion once the app's own health check passes;
      # the companion has no health check, so its readiness is the line it
      # logs once it is bound. Bounded at five minutes.
      - name: Wait for the app's health and the companion's listener
        if: steps.changes.outputs.build == 'true'
        run: |
          deadline=$((SECONDS + 300))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2> /dev/null)" = healthy ] &&
            docker compose logs mcp 2> /dev/null | grep -q 'MCP server listening on'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "The app was not healthy, or the companion not listening, within five minutes."
              exit 1
            fi
            sleep 5
          done
          echo "The app is healthy and the companion listens."

      # Through the published loopback port, under 127.0.0.1, a Host the app
      # always allows.
      - name: The page answers
        if: steps.changes.outputs.build == 'true'
        run: |
          page="$(curl -fsSL --max-time 30 http://127.0.0.1:4000/)"
          if ! grep -q '<title>Portfolixir</title>' <<< "$page"; then
            echo "The page answered without the application's title."
            exit 1
          fi
          echo "The page answers."

      # The token reaches curl on its standard input, never on its command
      # line, as in docs/home-deployment.md.
      - name: An API read answers with the generated token
        if: steps.changes.outputs.build == 'true'
        run: |
          token="$(grep '^PORTFOLIXIR_API_TOKEN=' .env | cut -d= -f2-)"
          contract="$(printf 'Authorization: Bearer %s\n' "$token" | curl -fsS --max-time 30 -H @- http://127.0.0.1:4000/api/v1/contract)"
          if ! grep -q '"contract_note"' <<< "$contract"; then
            echo "The contract read answered without its payload."
            exit 1
          fi
          echo "The API answers its contract read."

      # One stateless streamable-HTTP call: the companion takes its own token,
      # reads the contract from the app under its Compose name with the API
      # token, and answers with the app's payload, whose contract_note only
      # the app writes.
      - name: The companion answers a tool call through the app
        if: steps.changes.outputs.build == 'true'
        run: |
          token="$(grep '^PORTFOLIXIR_MCP_TOKEN=' .env | cut -d= -f2-)"
          call='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"portfolixir.contract.get","arguments":{}}}'
          answer="$(printf 'Authorization: Bearer %s\n' "$token" | curl -fsS --max-time 30 -H @- \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$call" http://127.0.0.1:4001/mcp)"
          if ! grep -q '"contract_note"' <<< "$answer" || grep -q '"isError":true' <<< "$answer"; then
            echo "The companion did not answer the contract read through the app:"
            echo "$answer"
            exit 1
          fi
          echo "The companion answers through the app."

      - name: Print the stack's state and logs
        if: failure() && steps.changes.outputs.build == 'true'
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Tear the stack down
        if: always() && steps.changes.outputs.build == 'true'
        run: |
          if [ -f .env ]; then docker compose down -v; fi
          rm -f .env
