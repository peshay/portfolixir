name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Run pre-commit quality gates
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Prepare database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate

      - name: Run test suite with coverage
        run: MIX_ENV=test mix coveralls.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Credo, Sobelow and Dialyzer are introduced as report-only for now:
      # findings show up in the logs but do not fail CI. Tighten by removing
      # the continue-on-error flags once the existing findings are addressed.
      - name: Credo
        continue-on-error: true
        run: mix credo --strict

      - name: Sobelow (security)
        continue-on-error: true
        run: mix sobelow --exit

      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27-elixir1.18.3-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp27-elixir1.18.3-

      - name: Build PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: mix dialyzer --plt

      - name: Dialyzer
        continue-on-error: true
        run: mix dialyzer --format github
