name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '27.0'

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Determine changed Elixir files
        id: changed-elixir
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -E '\.(ex|exs)$' || true)

          if [ -n "$files" ]; then
            {
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Credo (strict, changed files only)
        if: steps.changed-elixir.outputs.has_files == 'true'
        run: |
          files=$(echo "${{ steps.changed-elixir.outputs.files }}" | tr '\n' ' ')
          mix credo --strict $files

      - name: Prepare database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate

      - name: Run test suite with coverage
        run: MIX_ENV=test mix coveralls.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          files: ./cover/excoveralls.xml
