name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  public-artifact-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Run public artifact guard
        run: pre-commit run --all-files

      - name: Run public commit metadata guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/public_artifact_guard.py --commit-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            scripts/public_artifact_guard.py --commit-range "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Run public PR body metadata guard
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s' "$PR_BODY" | scripts/public_artifact_guard.py --stdin --label "pull_request_body"

  test:
    runs-on: ubuntu-latest
    needs: public-artifact-guard

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17.3'
          otp-version: '27.0'

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Prepare database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate

      - name: Run test suite
        run: MIX_ENV=test mix test

      - name: Generate coverage report
        run: MIX_ENV=test mix coveralls.xml

      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR_PERCENT: "87.8"
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          floor = float(os.environ.get("COVERAGE_FLOOR_PERCENT", "0"))
          root = ET.parse("cover/excoveralls.xml").getroot()

          lines = root.findall('.//lineToCover')
          total = len(lines)
          covered = sum(1 for line in lines if line.attrib.get('covered') == 'true')

          if total == 0:
              print("Coverage report has no measurable lines")
              sys.exit(1)

          percent = (covered / total) * 100.0
          print(f"Coverage: {percent:.2f}% (floor: {floor:.2f}%)")

          if percent + 1e-9 < floor:
              print("Coverage floor check failed")
              sys.exit(1)
          PY
