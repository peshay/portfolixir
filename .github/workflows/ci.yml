name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege for the whole workflow: every job here only reads the
# repository. Checkout, the language toolchains and the quality gates need
# nothing more, and the Codecov upload authenticates with its own token
# rather than the workflow's GITHUB_TOKEN. Without this key GitHub grants the
# default token set, which is wider than any job here uses.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Run pre-commit quality gates
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Prepare database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate

      - name: Run test suite with coverage
        run: MIX_ENV=test mix coveralls.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          fail_ci_if_error: true

  quality:
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      # Hex 2.5's `mix hex.audit` gained advisory gating (hex.pm EEF feed)
      # with NO ignore mechanism, so unpatched-upstream advisories (currently
      # cowlib EEF-CVE-2026-43966 MEDIUM / -43969 LOW — no fixed release
      # exists) would hard-fail CI with no recourse. Advisory gating with a
      # documented ignore list lives in the mix_audit step below; this step's
      # unique job is the RETIREMENT check, so Hex is pinned to 2.4.1 (the
      # last retirement-only hex.audit). Revisit when hex.audit learns
      # ignores or a fixed cowlib ships.
      - name: Pin Hex for the retirement-only audit
        run: mix local.hex 2.4.1 --force

      - name: Audit retired Hex packages
        run: mix hex.audit

      # Fails the build on known security advisories in the Hex dependency
      # tree (mix_audit). Enabled together with the upgrades that cleared the
      # then-active HIGH advisories (cowlib, cowboy, plug_cowboy, postgrex) in
      # issue #359.
      #
      # cowlib EEF-CVE-2026-43969 / CVE-2026-43969 / GHSA-g2wm-735q-3f56 (low;
      # cookie-encoder CRLF injection) is ignored under all its ids: the
      # advisory has NO fixed release — 2.18.0 is still inside the vulnerable
      # range (2.16.1 was additionally retired on hex.pm, which the separate
      # `mix hex.audit` step catches; we run the newest cowlib regardless).
      # This mirrors the HIGH-gated posture of the npm audit
      # (`--audit-level=high`); all HIGH/moderate Hex advisories are cleared
      # by upgrades, not by ignores. Revisit when a fixed cowlib ships.
      - name: Audit Hex dependencies
        run: mix deps.audit --ignore-advisory-ids GHSA-g2wm-735q-3f56,EEF-CVE-2026-43969,CVE-2026-43969

      - name: Audit MCP server dependencies (npm)
        run: npm audit --audit-level=high --prefix mcp-server

      # AGENTS.md has always required `npm test` and `npm run build` for the
      # MCP companion, but CI only audited its dependencies — so an MCP-only
      # change (or a transitive major bump underneath the SDK) rested on an
      # unverifiable local claim. Under ADR-0036 "every quality gate green"
      # replaces the per-PR human read, so the companion's own gates have to
      # run here too. `npm ci` installs from the lockfile the audit above
      # already checked. `--ignore-scripts` blocks dependency lifecycle
      # scripts, which are arbitrary code execution on the runner at install
      # time; nothing in this tree needs them (the deps are the MCP SDK,
      # express, zod, tsx and typescript), and both gates below pass without.
      - name: Install MCP server dependencies
        run: npm ci --ignore-scripts --prefix mcp-server

      - name: MCP server tests
        run: npm test --prefix mcp-server

      - name: MCP server build
        run: npm run build --prefix mcp-server

      # Credo, Sobelow and Dialyzer are blocking quality gates. Sobelow skips
      # are per-function `# sobelow_skip` annotations with a written reason;
      # Config.CSP and Config.HTTPS are ignored deliberately: TLS is the
      # operator's reverse-proxy concern for a self-hosted app, and a CSP
      # needs nonce support for the inline theme/LiveView boot scripts first
      # (tracked as a follow-up story).
      - name: Credo
        run: mix credo --strict

      - name: Sobelow (security)
        run: mix sobelow --skip --exit --ignore Config.CSP,Config.HTTPS

      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27-elixir1.18.3-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp27-elixir1.18.3-

      - name: Build PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer --format short

  migration-immutability:
    runs-on: ubuntu-latest
    # Only meaningful on pull requests: it compares the branch against the
    # base. On a push to main there is no incoming change set to police, and
    # the diff would be empty or misleading, so the job is skipped there.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the diff against the base branch resolves.
          fetch-depth: 0

      # Applied migrations are immutable (see the migration-roundtrip job): an
      # already-merged migration must never be edited or deleted, only new ones
      # added. --diff-filter=MD lists files that this branch Modified or
      # Deleted under priv/repo/migrations/; any such file fails the gate.
      - name: Reject edits or deletions of existing migrations
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}"
          changed="$(git diff --diff-filter=MD --name-only "$base"...HEAD -- priv/repo/migrations/)"
          if [ -n "$changed" ]; then
            echo "Applied migrations are immutable; the following existing files were modified or deleted:"
            echo "$changed"
            exit 1
          fi
          echo "No existing migration was modified or deleted."

  migration-roundtrip:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Create database
        run: MIX_ENV=test mix ecto.create

      # A full `mix ecto.rollback --all` is not used: an early historical
      # migration (ExtendTransactionsForPpImport) is deliberately irreversible
      # (it drops a constraint with no inverse), and applied migrations are
      # treated as immutable, so they cannot be retrofitted with down/0. This
      # job instead verifies that the most recent migration is reversible
      # (migrate -> rollback one step -> migrate), which is the regression that
      # actually matters for new PRs.
      - name: Migrate, roll back latest, migrate again
        run: |
          MIX_ENV=test mix ecto.migrate
          MIX_ENV=test mix ecto.rollback
          MIX_ENV=test mix ecto.migrate

  # SonarQube Cloud analysis, driven from CI rather than by Automatic Analysis.
  # Automatic Analysis ignores `sonar-project.properties`, so the exclusion of
  # `_bmad-output/**` never applied and every planning PR failed the new-code
  # duplication gate on committed BMad artifacts (agent-generated documents and
  # HTML prototypes that repeat a component by construction). Running the
  # scanner here makes the properties file authoritative and lets anyone
  # working on the repo reproduce and inspect a result.
  #
  # Requires the SONAR_TOKEN secret, and Automatic Analysis must be off for
  # this project — the two analysis methods are mutually exclusive.
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the scanner needs blame data to decide what counts as
          # new code. A shallow clone silently degrades the new-code metrics
          # the quality gate is built on.
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
