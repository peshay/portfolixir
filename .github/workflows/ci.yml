name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Install pre-commit
        run: python3 -m pip install --upgrade pre-commit

      - name: Run pre-commit quality gates
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Prepare database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate

      - name: Run test suite with coverage
        run: MIX_ENV=test mix coveralls.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover/excoveralls.json
          fail_ci_if_error: true

  quality:
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Audit retired Hex packages
        run: mix hex.audit

      - name: Audit dependencies for known vulnerabilities
        run: mix deps.audit

      - name: Audit MCP server dependencies (npm)
        run: npm audit --audit-level=high --prefix mcp-server

      # Credo, Sobelow and Dialyzer are blocking quality gates. Sobelow skips
      # are per-function `# sobelow_skip` annotations with a written reason;
      # Config.CSP and Config.HTTPS are ignored deliberately: TLS is the
      # operator's reverse-proxy concern for a self-hosted app, and a CSP
      # needs nonce support for the inline theme/LiveView boot scripts first
      # (tracked as a follow-up story).
      - name: Credo
        run: mix credo --strict

      - name: Sobelow (security)
        run: mix sobelow --skip --exit --ignore Config.CSP,Config.HTTPS

      - name: Restore PLT cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp27-elixir1.18.3-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-otp27-elixir1.18.3-

      - name: Build PLT
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer --format short

  migration-roundtrip:
    runs-on: ubuntu-latest
    needs: pre-commit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolixir_test
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.3'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Create database
        run: MIX_ENV=test mix ecto.create

      - name: Migrate, roll back all, migrate again
        run: |
          MIX_ENV=test mix ecto.migrate
          MIX_ENV=test mix ecto.rollback --all
          MIX_ENV=test mix ecto.migrate
