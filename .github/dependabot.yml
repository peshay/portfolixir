# Dependency update visibility (#676, Quality Gate Roadmap item 3).
#
# Dependabot opens update PRs for the ecosystems this repository actually
# uses: Mix, npm, GitHub Actions, the Dockerfiles and the Compose files. Update PRs are reviewed like any dependency PR and are
# NEVER auto-merged (standing decision, Dependency Update Policy in
# _bmad-output/project-context.md). The per-batch maintenance lane
# (AGENTS.md, Epic-Batch Workflow) remains the deciding reviewer; a
# fuller point-in-time picture comes from scripts/version-report.sh.
version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    # Types follow the pinned runtime major (#728: Node 24 LTS in CI, the
    # companion's Dockerfile and engines.node). A @types/node major beyond it
    # is declined, not deferred -- it becomes a candidate when the runtime pin
    # moves. Sprint 8 ignored one version (24 -> 26.2.0) and the bot reopened
    # the same major as 26.3.0 (#744); the ignore is now major-wide.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The images (#760, #761, E25 S2): exact tags pinned by digest (ADR-0045
  # §2), kept current here instead of by hand; an update moves tag and digest
  # together.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Elixir images and the release runtime's Debian are moved by the
    # maintenance lane, not here (the 2026-09-24 runtime hotfix): the bot reads
    # the hexpm tag's OTP patch and Debian date as a fixed suffix, so it can
    # never propose the security-relevant move, and a runtime Debian bump on
    # its own fails ci_test's parity with the build stage by design.
    # scripts/version-report.sh prints what the images actually contain.
    ignore:
      - dependency-name: "hexpm/elixir"
      - dependency-name: "debian"

  - package-ecosystem: "docker"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"

  # The Compose files' images (E25 S2): the database, pinned by tag and digest
  # in docker-compose.yml and docker-compose.dev.yml. A PostgreSQL major is
  # declined, not deferred: its data directory needs a dump and a restore
  # (docs/home-deployment.md), which a version bump cannot do.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
