# Codecov configuration for Portfolixir.
#
# Part of the incremental coverage ratchet defined in issue #314
# ("Harden CI: coverage ratchet"). This step raises the project floor from
# 85% to 90% (Sprint 16's maintenance lane). The epic branch measured 93.5%
# locally (mix coveralls) and Codecov reported ~93.7% on its pull request,
# which leaves ~3.5% headroom for fluctuations while any regression below 90%
# fails the gate.
#
# Ratchet plan (one small step at a time, per #314):
#   * project: explicit 90% floor now (was 85%). The ratchet stops where
#     assertions stay meaningful (maintainer decision 2026-06-11): no bump
#     past the point where tests would exist only to satisfy the metric.
#   * patch: changed lines must be ~90%+ covered (the issue's "~90%+ changed
#     lines" bar), so every new PR pulls the overall number upward.
#   * threshold: 1% — allows up to 1% drop versus the base commit so that
#     legitimate code deletions / small refactors don't false-fail the gate.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
