# Codecov configuration for Portfolixir.
#
# Part of the incremental coverage ratchet defined in issue #314
# ("Harden CI: coverage ratchet"). This is the next step: the project floor is
# raised from 84% to 85%. Main is currently at ~85.7%, which leaves ~0.7%
# headroom for minor fluctuations while ensuring any regression below 85% fails
# the gate.
#
# Ratchet plan (one small PR per step, per #314):
#   * project: explicit 85% floor now (was 84%); will be raised to 90% in a
#     later increment as coverage continues to climb.
#   * patch: changed lines must be ~90%+ covered (the issue's "~90%+ changed
#     lines" bar), so every new PR pulls the overall number upward.
#   * threshold: 1% — allows up to 1% drop versus the base commit so that
#     legitimate code deletions / small refactors don't false-fail the gate.
coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
