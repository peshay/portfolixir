  <text x="255" y="120" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="57" font-weight="800" fill="var(--ink)">Portfolixir</text>
  <text x="258" y="159" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="520" fill="var(--muted)">Your portfolio, distilled.</text>
