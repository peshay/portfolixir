<svg width="820" height="260" viewBox="0 0 820 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Portfolixir official logo</title>
  <desc id="desc">The Portfolixir wordmark with a round flask containing violet, teal green, and coral red chart-like liquid layers.</desc>
  <style>
    :root {
      --ink: #201631;
      --muted: #756A86;
      --outline: #201631;
      --separator: #FCFBFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #F7F3FF;
        --muted: #C4B5FD;
        --outline: #F5F3FF;
        --separator: #12101A;
      }
    }
  </style>
  <defs>
    <linearGradient id="a" x1="76" y1="40" x2="201" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="b" x1="74" y1="80" x2="204" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="c" x1="74" y1="110" x2="204" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <clipPath id="liquidClip">
      <path d="M112 50H144V96L189 167C202 188 187 218.5 160.5 218.5H95.5C69 218.5 54 188 67 167L112 96V50Z"/>
    </clipPath>
  </defs>
  <g>
