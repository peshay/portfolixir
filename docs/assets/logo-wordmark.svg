      <path d="M50 147L75 169L103 142L132 155L158 128L204 90V232H50V147Z" fill="url(#b)" opacity="0.96"/>
      <path d="M50 184L79 202L112 176L143 189L172 159L204 132V232H50V184Z" fill="url(#c)" opacity="0.98"/>
      <path d="M62 118L74 133L102 103L127 121L152 80L179 106L193 88" stroke="var(--separator)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 158L75 169L103 142L132 155L158 128L193 99" stroke="var(--separator)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 191L79 202L112 176L143 189L172 159L193 141" stroke="var(--separator)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
