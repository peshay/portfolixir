services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolixir_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - portfolixir-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolixir_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: dev
      DATABASE_HOST: db
      DATABASE_NAME: portfolixir_dev
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      PHX_BIND_ALL: true
      PORT: 4000
    ports:
      - "4000:4000"
    command: ["mix", "phx.server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - .:/app
      - app-deps:/app/deps
      - app-build:/app/_build

volumes:
  portfolixir-postgres-data:
  app-deps:
  app-build:
