# The documented home deployment (ADR-0045 §2, #760): a production release
# behind the operator's reverse proxy.
#
# - Every secret is required; there is no fallback value. Copy .env.example
#   to .env and set SECRET_KEY_BASE, POSTGRES_PASSWORD, PORTFOLIXIR_API_TOKEN
#   and PORTFOLIXIR_MCP_TOKEN (openssl rand -base64 48; POSTGRES_PASSWORD
#   with openssl rand -hex 32, because it is spliced into a URL below).
# - The database is not published; the application reaches it over the
#   Compose network only.
# - The application and the MCP companion are published on loopback. A
#   reverse proxy on the same host terminates TLS and forwards to them;
#   set PHX_HOST to the name the proxy serves and PORTFOLIXIR_ALLOWED_HOSTS
#   for any further name.
# - Set PORTFOLIXIR_UI_PASSWORD to require a login on the web UI; leave it
#   unset only behind reverse-proxy authentication. Inside its container the
#   app listens on every interface, and the loopback mapping, on Docker
#   Engine 28.3.3 or newer, is what keeps it on this host
#   (docs/home-deployment.md, "Reach").
#
# Development uses docker-compose.dev.yml (source mounted, Mix present):
#   docker compose -f docker-compose.dev.yml up --build

services:
  db:
    # Pinned by tag and digest (ADR-0045 §2, E25 S2); Dependabot's
    # docker-compose ecosystem moves both, never across a PostgreSQL major.
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: portfolixir_prod
      POSTGRES_USER: portfolixir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - portfolixir-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolixir -d portfolixir_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.release
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://portfolixir:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/portfolixir_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (openssl rand -base64 48)}
      PORTFOLIXIR_API_TOKEN: ${PORTFOLIXIR_API_TOKEN:?set PORTFOLIXIR_API_TOKEN in .env}
      PORTFOLIXIR_UI_PASSWORD: ${PORTFOLIXIR_UI_PASSWORD:-}
      PORTFOLIXIR_SESSION_DAYS: ${PORTFOLIXIR_SESSION_DAYS:-}
      PHX_HOST: ${PHX_HOST:-localhost}
      # "app" is the name the MCP companion reaches the app under.
      PORTFOLIXIR_ALLOWED_HOSTS: app,${PORTFOLIXIR_ALLOWED_HOSTS:-}
      PHX_FORCE_SSL: ${PHX_FORCE_SSL:-false}
      # The companion calls the app over plain HTTP under "app" on the
      # Compose network; PHX_FORCE_SSL leaves that name unredirected.
      PORTFOLIXIR_FORCE_SSL_EXCLUDED_HOSTS: app
      # The reverse proxy reaches the container through the Docker bridge;
      # name that exact address so the throttle sees the client behind it and
      # the forwarded scheme is believed (docs/home-deployment.md).
      PORTFOLIXIR_TRUSTED_PROXIES: ${PORTFOLIXIR_TRUSTED_PROXIES:-}
      # The container must listen on its own interface for the port mapping;
      # the mapping below keeps it on the host's loopback.
      PHX_BIND_ALL: "true"
      PORT: 4000
      # The zone that decides what "today" is; each database session takes
      # the same zone on connect (docs/home-deployment.md).
      TZ: ${TZ:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # The stored logos, outside the release tree, which stays read-only for
      # the user the app runs as; part of the backup (docs/home-deployment.md).
      - portfolixir-logos:/var/lib/portfolixir/logos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      PORTFOLIXIR_API_BASE_URL: http://app:4000
      PORTFOLIXIR_API_TOKEN: ${PORTFOLIXIR_API_TOKEN:?set PORTFOLIXIR_API_TOKEN in .env}
      PORTFOLIXIR_MCP_TOKEN: ${PORTFOLIXIR_MCP_TOKEN:?set PORTFOLIXIR_MCP_TOKEN in .env}
      PORTFOLIXIR_MCP_TRANSPORT: http
      PORTFOLIXIR_MCP_HOST: 0.0.0.0
      PORTFOLIXIR_MCP_PORT: 4001
      # Further Host names the companion answers under (a proxy name).
      PORTFOLIXIR_MCP_ALLOWED_HOSTS: ${PORTFOLIXIR_MCP_ALLOWED_HOSTS:-}
      # true: the companion lists and calls only the tools that change nothing.
      PORTFOLIXIR_MCP_READ_ONLY: ${PORTFOLIXIR_MCP_READ_ONLY:-false}
    ports:
      - "127.0.0.1:4001:4001"
    restart: unless-stopped

volumes:
  portfolixir-postgres-data:
  portfolixir-logos:
