<!doctype html>
<html lang="de" data-theme="light" data-accent="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04g-dq-wo-katalog</title>
<link rel="stylesheet" href="../../../../../../priv/static/app.css">
<style id="frame">
body { margin: 0; background: var(--color-bg); }
.mock-new { outline: 2px dashed var(--color-accent); outline-offset: 2px; border-radius: 8px; }
.mock-pad { padding: 16px 20px; }
.mock-crop { margin: 0; padding: 8px 12px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); font-size: 12px; color: var(--color-text-muted); }
.mock-gone { padding: 10px 14px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); font-size: 12.5px; color: var(--color-text-muted); background: var(--color-bg-muted); }
</style>
<style id="proposal"></style>
</head>
<body><div class="mock-pad">
<section class="workspace-panel">
<div id="securities-filter-chips" class="filter-chips" role="group" aria-label="Liste filtern">



  <button type="button" id="sec-chip-held" class="filter-chip " aria-pressed="false">
    Im Bestand
  </button>
  <button type="button" id="sec-chip-not_held" class="filter-chip " aria-pressed="false">
    Ohne Bestand
  </button>






  <button type="button" id="sec-chip-unclassified" class="filter-chip " aria-pressed="false">
    Ohne Anlageklasse
  </button>

    <button type="button" id="sec-chip-stale_quote" class="filter-chip is-active mock-new" aria-pressed="true">
      Kurs veraltet
    </button>

    <button type="button" id="sec-chip-missing_quote" class="filter-chip " aria-pressed="false">
      Kein Kurs
    </button>

    <button type="button" id="sec-chip-missing_fx" class="filter-chip " aria-pressed="false">
      Kein Wechselkurs
    </button>

    <button type="button" id="sec-chip-currency_mismatch" class="filter-chip " aria-pressed="false">
      Währung abweichend
    </button>




  <span class="filter-chips__family">Währung</span>


    <button type="button" id="sec-chip-cur-CAD" class="filter-chip " aria-pressed="false">
      CAD
    </button>

    <button type="button" id="sec-chip-cur-CHF" class="filter-chip " aria-pressed="false">
      CHF
    </button>

    <button type="button" id="sec-chip-cur-EUR" class="filter-chip " aria-pressed="false">
      EUR
    </button>

    <button type="button" id="sec-chip-cur-USD" class="filter-chip " aria-pressed="false">
      USD
    </button>




  <span class="filter-chips__family">Anlageklasse</span>


    <button type="button" id="sec-chip-class-equity" class="filter-chip " aria-pressed="false">
      Aktie
    </button>

    <button type="button" id="sec-chip-class-etf" class="filter-chip " aria-pressed="false">
      ETF
    </button>

    <button type="button" id="sec-chip-class-fund" class="filter-chip " aria-pressed="false">
      Fonds
    </button>

    <button type="button" id="sec-chip-class-bond" class="filter-chip " aria-pressed="false">
      Anleihe
    </button>

    <button type="button" id="sec-chip-class-crypto" class="filter-chip " aria-pressed="false">
      Kryptowährung
    </button>




  <span id="changed-since-chips" class="filter-chips__group" role="group" aria-label="Geändert seit">
  <span class="filter-chips__family">Geändert seit</span>

    <button type="button" id="changed-since-chips-today" class="filter-chip " aria-pressed="false">
      Heute
    </button>

    <button type="button" id="changed-since-chips-7d" class="filter-chip " aria-pressed="false">
      7 Tage
    </button>

    <button type="button" id="changed-since-chips-30d" class="filter-chip " aria-pressed="false">
      30 Tage
    </button>

</span>





  <button type="button" id="more-filters-toggle" class="more-filters-link " aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="" aria-hidden="true">
<path d="M3 5h18l-7 9v6l-4-2v-4Z">
</path>
</svg>
    Weitere Filter

  </button>


  </div>
</section>
</div></body>
</html>
