<!doctype html>
<html lang="de" data-theme="light" data-accent="violet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06a-journal-heute</title>
<link rel="stylesheet" href="../../../../../../priv/static/app.css">
<style id="frame">
body { margin: 0; background: var(--color-bg); }
.mock-new { outline: 2px dashed var(--color-accent); outline-offset: 2px; border-radius: 8px; }
.mock-pad { padding: 16px 20px; }
.mock-crop { margin: 0; padding: 8px 12px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); font-size: 12px; color: var(--color-text-muted); }
.mock-gone { padding: 10px 14px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); font-size: 12.5px; color: var(--color-text-muted); background: var(--color-bg-muted); }
</style>
<style id="proposal"></style>
</head>
<body><div class="mock-pad" style="width: 390px; box-sizing: border-box;">
<div class="workspace-page">
<section class="workspace-section">
<div id="journal-chips" class="filter-chips" role="group" aria-label="Journal filtern">
        <span>
          <span class="filter-chips__family">Akteur</span>
          <button type="button" id="journal-chip-actor-all" class="filter-chip is-active" aria-pressed="true" phx-value-actor_type="">
            Alle
          </button>
          <button type="button" id="journal-chip-actor-owner_ui" class="filter-chip " aria-pressed="false" phx-value-actor_type="owner_ui">
            Operator
          </button>
<button type="button" id="journal-chip-actor-api_token_rw" class="filter-chip " aria-pressed="false" phx-value-actor_type="api_token_rw">
            Agent
          </button>
<button type="button" id="journal-chip-actor-import_session" class="filter-chip " aria-pressed="false" phx-value-actor_type="import_session">
            Import
          </button>
<button type="button" id="journal-chip-actor-system_job" class="filter-chip " aria-pressed="false" phx-value-actor_type="system_job">
            System
          </button>
        </span>
        <span>
          <span class="filter-chips__family">Vorgang</span>
          <button type="button" id="journal-chip-operation-create" class="filter-chip " aria-pressed="false">
            Angelegt
          </button>
<button type="button" id="journal-chip-operation-update" class="filter-chip " aria-pressed="false">
            Geändert
          </button>
<button type="button" id="journal-chip-operation-delete" class="filter-chip " aria-pressed="false">
            Gelöscht
          </button>
<button type="button" id="journal-chip-operation-upsert" class="filter-chip " aria-pressed="false">
            Angelegt oder ersetzt
          </button>
        </span>
      </div>
<form id="journal-filters" class="journal-filters">
        <label class="journal-filters__kind">
          <span class="visually-hidden">Art</span>
          <select id="journal-kind" name="resource_type">
            <option value="" selected="">Alle Arten</option>
            <option value="transaction">
              Transaktion
            </option><option value="security">
              Wertpapier
            </option><option value="security_quotes">
              Kurse
            </option><option value="security_event">
              Termin
            </option><option value="security_note">
              Research-Notiz
            </option><option value="prediction">
              Prognose
            </option><option value="security_identifier_alias">
              Frühere ISIN
            </option><option value="security_category_assignment">
              Kategorie-Zuordnung
            </option><option value="cash_account">
              Verrechnungskonto
            </option><option value="securities_account">
              Depot
            </option><option value="cash_account_bucket_assignment">
              Buckets des Verrechnungskontos
            </option><option value="depot_bucket_assignment">
              Buckets des Depots
            </option><option value="position_bucket_override">
              Buckets der Position
            </option><option value="portfolio">
              Portfolio
            </option><option value="bucket">
              Bucket
            </option><option value="view">
              Ansicht
            </option><option value="classification">
              Klassifizierung
            </option><option value="category">
              Kategorie
            </option><option value="target">
              Soll-Gewicht
            </option><option value="target_plan">
              Soll-Plan
            </option><option value="policy_rule">
              Regel
            </option><option value="policy_rule_version">
              Regelversion
            </option><option value="snapshot">
              Snapshot
            </option><option value="tax_statement_snapshot">
              Erfasste Abrechnung
            </option><option value="tax_profile">
              Steuerprofil
            </option><option value="tax_parameters">
              Steuerparameter
            </option><option value="allowance_order">
              Freistellungsauftrag
            </option><option value="setting">
              Einstellung
            </option><option value="merge_record">
              Zusammenführung
            </option><option value="retired_import_hash">
              Entfernte Importzeile
            </option>
          </select>
        </label>

        <label class="journal-filters__since">
          Seit
          <input type="text" id="journal-since" name="since" value="" placeholder="YYYY-MM-DD" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" maxlength="10" autocomplete="off">
        </label>
        <label class="journal-filters__scenarios">
          <input type="hidden" name="include_scenarios" value="false">
          <input type="checkbox" id="journal-scenarios" name="include_scenarios" value="true">
          Was-wäre-wenn-Szenarien einbeziehen
        </label>
      </form>
</section>
</div>
</div></body>
</html>
