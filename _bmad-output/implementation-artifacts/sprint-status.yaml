# SPRINT 6 AMENDED (2026-08-14): Lane D added - #686 - and RE-SCOPED the same
# day, after the first diagnosis proved wrong. Recorded in full because the way
# it was wrong is the reusable lesson.
#
# As filed: "a hand-entered loss sale cannot book its tax refund", read from the
# changeset rule `taxes >= 0` plus `tax_refund` being absent from the form's
# type selector. Proposed fix (OQ-4 option A): teach the manual form to accept a
# negative tax and auto-split it into a companion `tax_refund` the way both PP
# importers do.
#
# What the owner reported: `tax_refund` is present AND in live use -- most of
# the existing bookings arrived through the PP import, and one was made by the
# very agent that reported the capability missing, weeks earlier. The ledger was
# never wrong. OQ-4 AND OPTION A ARE WITHDRAWN: the `taxes >= 0` rule stays,
# because it is what keeps ONE representation of a refund. The importers split a
# signed value only because PP's file format hands them one; manual entry has no
# such constraint, so building it would have added a second way to express a
# refund in order to fix a discoverability problem. Option B (sign-bearing taxes
# on buy/sell) was rejected before and stays rejected, for that same reason.
#
# The lane is now the affordance gap that actually caused the failure: (D1) the
# rejection is a bare Ecto message naming no alternative, (D2) `tax_refund` is
# missing from the direction enumeration in transactions.create, (D3)
# holdings.reconcile names set_balance as a last resort without ever naming
# tax_refund as the right answer, (D4) the type value appears once in all of
# docs/, inside ADR-0031. Consequence is data quality, not convenience: the
# surface steers agents toward set_balance, which the schema itself calls
# balance-looks-right-while-hiding-what-happened.
#
