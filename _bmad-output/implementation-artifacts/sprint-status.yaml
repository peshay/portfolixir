# * THE BATCH WAS TOO BIG FOR ONE PR. 336 commits and 1,402 files (775 of them
#   the BMAD re-pin) on one branch. GitHub refuses a rebase-merge beyond 100
#   commits, so the owner fast-forwarded by hand, and the review surface was
#   one PR no human reads whole. The owner's note in the session of
#   2026-09-29: the lanes should have been separate PRs. Carry forward: a batch that will exceed ~100 commits is cut
#   into lane PRs at planning, each merged in order; the planning PR names
#   the cut.
# * THE REVIEWS PAID WHERE CI IS BLIND, AND ONLY THERE. At the owner's request
#   a value audit read the session's own records of the batch's 13 workflow
#   runs (session-local transcripts, not committed; the figures in this
#   bullet come from them): 244 subagents, about 34 h of active agent time,
#   2.6 M output tokens; 285 findings raised, 236 confirmed, 31 refuted, 68
#   labelled blocking or major. The catches that justified the
#   spend share one property -- no gate can see them: upgrade migrations over
#   legacy rows (two would have stopped the release from booting: the import
#   hash-kind CHECK and CR-1's author backfill), double or lost bookings on
#   re-import (the former-name backfill, F37's refund companion, a merge
#   chain), lock-order cycles (importer against rename, ISIN writers, delete
#   against override), and mint 1.11.0 handing Finch a timed-out connection
#   (every provider test stubs the transport). Several were rationalised in
#   writing by the agent that built them; independent context caught them,
#   parallelism did not. About a quarter to a third of the spend added no
#   catch: the 78-agent scope-lock triage (a fifth of all tokens, 24 % of it
#   on candidates a later lane had already fixed, and one lock-order
#   inversion filed as two issues, #919 and #954, with opposite fixes),
#   verifier fleets (nine verifiers, one refutation), overlapping lenses (35 %
#   duplicates in one run), review-of-review layers with falling yield, and
#   implementation "parallelism" whose main tracks ran in sequence anyway
#   while worktrees forked from a base up to 208 commits stale. Carry
#   forward: one independent lens per risk class (seeded-upgrade, concurrency
#   and lock order, money identity, dependency chokepoint) instead of
#   multi-lens everywhere; stop a review cascade when a layer yields no major;
#   one triage agent with a `git log --grep` pre-filter; implementers'
#   out-of-scope notes handed to the fixer in full, by file, never truncated;
#   worktrees from the branch head; full suites capped at the core count.
# * TURN THE RECURRING CATCHES INTO GATES. Four upgrade-path defects and four
#   lock-order defects in one batch say the gates lack two harnesses: a
#   seeded-upgrade test (synthetic legacy rows at the pre-migration version,
#   then `mix ecto.migrate`) and a two-connection lock-order test. Proposed
#   for Sprint 17's planning, so the next batch stops paying a reviewer to
#   find what a gate could.
