# SURFACE CHECK (the 2026-09-03 owner decision): one new bounded parameter
# landed, days= on the events family, and the family is named in full. The
# three horizon-capable reads are GET /api/v1/events/upcoming, /stale and
# /unconfirmed. days= is carried by upcoming and stale and is DELIBERATELY
# ABSENT from unconfirmed, because that queue has no horizon -- every
# unconfirmed past date belongs in it however old it is. The absence is the
# point of the check: the MCP tool advertised days= on unconfirmed anyway,
# the correctness hunter caught it, and the tool now has its own schema with
# a test pinning the property set. days= is capped at ten years and echoed
# capped, the same contract limit= carries. limit= itself became uniform
# this batch: #811 put the journal read on the shared ListLimit parser, so
# the bounded-list family now has one parser and no second copy to drift.
#
# OWNER DECISION IN-BATCH (2026-09-19, #838): a refused count-based metric
# renders window: null, and ADR-0047 §6 said both halves are required. The
# owner chose variant C and §6 is amended on the branch: a COMPUTED metric
# carries the span it measured, a REFUSED one carries what it had and, as
# `required`, what it needed, with window the requested span where the
# metric is defined over a date range and null where it is defined over a
# count of closes. The amendment also names the wider gap the same review
# exposed -- no refusal states its threshold today -- and one limit it will
# not paper over: where the requirement is a coverage rule rather than a
# count (momentum, distance_to_extremes) `required` carries the floor only.
# Wording is adopted; the payload half rides Lane A2 into Sprint 14, which
# extends the same payload, so the surface takes one contract bump instead
# of two. #838 is re-scoped from needs-decision to that implementation.
