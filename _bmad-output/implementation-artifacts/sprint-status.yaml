#   hand found #954's backstop and #919's not-found half unbuilt on this
#   batch's own code. Carry forward: plan the batch against a token budget
#   below the cap, with the closing act and the briefing reserved; a workflow
#   whose phase returns null reports failed; a closing keyword is checked
#   against the diff before the PR body names it.
