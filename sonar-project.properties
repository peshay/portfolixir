# SonarCloud project configuration for Portfolixir.
#
# Exclude test code from copy-paste (duplication) detection. Test setup is
# legitimately repetitive: many test modules arrange the same small "world"
# (a portfolio with a cash account and a securities depot) and assert against
# it. We already de-duplicate that setup via shared helpers under
# test/support/fixtures (Elixir) and test/support (MCP TypeScript), but the
# residual, intentional repetition in test bodies should not count against the
# new-code duplication gate (issue #368).
sonar.cpd.exclusions=test/**,mcp-server/test/**

# Exclude BMad planning artifacts from analysis entirely. `_bmad-output/`
# holds agent-generated planning documents (PRDs, decision logs, review and
# validation reports) that are committed as part of the story record, not as
# product code. They are generated from templates, so any HTML/CSS they carry
# is duplicated across runs by construction and would fail the new-code
# duplication gate without saying anything about the codebase (issue #368 is
# the related test-duplication case).
sonar.exclusions=_bmad-output/**

# Project and organization keys as used by SonarQube Cloud for this repository.
# The organization is derived from the project key, which SonarCloud generates
# as `<organization>_<repository>`. Correct it here if the organization was
# later renamed.
sonar.projectKey=peshay_portfolixir
sonar.organization=peshay

# Analysis runs from CI (`.github/workflows/ci.yml`, job `sonarqube`), NOT via
# Automatic Analysis. That is deliberate: Automatic Analysis does not honour
# this file, so the exclusions above silently did not apply and every planning
# PR failed the new-code duplication gate on committed BMad artifacts. A
# CI-driven scan reads this file, which means the exclusions hold and an agent
# can reproduce and inspect the result without SonarCloud UI access.
#
# Automatic Analysis and CI analysis are mutually exclusive. If SonarQube Cloud
# reports "you are running CI analysis while Automatic Analysis is enabled",
# turn Automatic Analysis off once under
# Administration > Analysis Method for this project.
